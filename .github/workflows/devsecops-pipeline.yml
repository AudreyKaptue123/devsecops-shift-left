name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build Docker image
        run: docker build -t demo-app:${{ github.sha }} .

  sast:
    name: SAST - Analyse statique du code (Bandit)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Bandit
        run: pip install bandit
      - name: Run Bandit
        run: bandit -r app/ -f json -o bandit-report.json || true
      - name: Upload SAST report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sast-report
          path: bandit-report.json

  sca:
    name: SCA - Analyse des dépendances (pip-audit)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit
        run: pip-audit -r app/requirements.txt -f json -o sca-report.json || true
      - name: Upload SCA report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sca-report
          path: sca-report.json

  iac-scan:
    name: IaC - Analyse du Dockerfile (Hadolint)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run Hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile
          format: sarif
          output-file: hadolint-report.sarif
          no-fail: true
      - name: Upload IaC report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iac-report
          path: hadolint-report.sarif

  gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [build, sast, sca, iac-scan]
    if: always()
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download SAST report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sast-report
      - name: Download SCA report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sca-report
      - name: Download IaC report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: iac-report
      - name: Evaluate security gate
        run: python3 security_gate.py
      - name: Publish gate report to step summary
        if: always()
        run: cat gate-report.md >> "$GITHUB_STEP_SUMMARY"
